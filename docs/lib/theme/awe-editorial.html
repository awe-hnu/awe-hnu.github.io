<script>
// awe-editorial: numbers section dividers, adds a running header to content
// slides, and fits table columns. Styling lives in awe-editorial.scss.
(function () {
  // classic decks (slide-theme: classic) use none of this; the running header
  // element would otherwise appear unstyled there
  if (document.documentElement.classList.contains('awe-classic')) return;

  var pad = function (n) { return n < 10 ? '0' + n : String(n); };
  var skip = ['discussion-slide', 'no-headline', 'headline-only',
              'accent-slide', 'bg-highlight', 'statement', 'no-kicker'];
  var section = 0;
  var title = '';
  var num = '';

  document.querySelectorAll('.reveal .slides section.slide').forEach(function (s) {
    var cls = s.classList;
    if (cls.contains('level1')) {
      var h = s.querySelector('h1');
      title = h ? h.textContent.trim() : '';
      num = '';
      if (cls.contains('headline-only') && !cls.contains('unlisted')) {
        section += 1;
        num = pad(section);
        s.setAttribute('data-awe-num', num);
      }
      return;
    }
    if (!title || skip.some(function (c) { return cls.contains(c); })) return;
    if (s.hasAttribute('data-background-color') || s.hasAttribute('data-background-image') ||
        s.querySelector(':scope > .background-color-div, :scope > .background-image-div')) return;
    // running header: dot, section number (highlight colour), section title
    var head = document.createElement('div');
    head.className = 'awe-runhead';
    if (num) {
      var n = document.createElement('span');
      n.className = 'awe-runhead-num';
      n.textContent = num;
      head.appendChild(n);
    }
    var t = document.createElement('span');
    t.className = 'awe-runhead-title';
    t.textContent = title;
    head.appendChild(t);
    s.insertBefore(head, s.firstChild);
    s.setAttribute('data-awe-kicker', '');
  });

  // Tables: fit columns to their content. The browser shares a shortfall in
  // proportion to each column's one-line width, so every column wraps a
  // little. Instead: measure each column's one-line width and longest word
  // (after fonts load); if everything fits, nothing wraps; otherwise keep the
  // narrowest columns on one line and let only the widest ones wrap.
  var ctx = document.createElement('canvas').getContext('2d');
  var textWidth = function (cell, text) {
    var cs = getComputedStyle(cell);
    ctx.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    return ctx.measureText(text).width * 1.02; // small buffer for bold runs
  };
  var sum = function (a) { return a.reduce(function (x, y) { return x + y; }, 0); };

  var fitTable = function (t) {
    var rows = Array.prototype.slice.call(t.rows);
    var n = rows.reduce(function (m, r) { return Math.max(m, r.cells.length); }, 0);
    var cols = [];
    for (var c = 0; c < n; c++) {
      cols.push(rows.map(function (r) { return r.cells[c]; }).filter(Boolean));
    }
    var maxW = cols.map(function (cells) {
      return Math.max.apply(null, cells.map(function (x) {
        return textWidth(x, x.textContent.trim());
      }));
    });
    var minW = cols.map(function (cells) {
      return Math.max.apply(null, cells.map(function (x) {
        return Math.max.apply(null, x.textContent.trim().split(/\s+/).map(function (w) {
          return textWidth(x, w);
        }));
      }));
    });
    var pad = cols.map(function (cells) {
      return parseFloat(getComputedStyle(cells[0]).paddingRight) || 0;
    });
    var avail = parseFloat(getComputedStyle(t).maxWidth) - sum(pad);
    if (!(avail > 0)) return;

    var fixed = {};
    var keys = cols.map(function (_, i) { return i; });
    if (sum(maxW) <= avail) {
      keys.forEach(function (k) { fixed[k] = true; });
    } else {
      keys.slice().sort(function (a, b) { return maxW[a] - maxW[b]; }).forEach(function (c) {
        var fixedW = sum(keys.filter(function (k) { return fixed[k]; }).map(function (k) { return maxW[k]; }));
        var restMin = sum(keys.filter(function (k) { return k !== c && !fixed[k]; })
                              .map(function (k) { return minW[k]; }));
        if (maxW[c] + fixedW + restMin <= avail) fixed[c] = true;
      });
    }
    cols.forEach(function (cells, c) {
      cells.forEach(function (x) { x.classList.toggle('awe-nowrap', !!fixed[c]); });
    });
  };

  var fitAll = function () {
    document.querySelectorAll('.reveal .slides table').forEach(fitTable);
  };
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitAll);
  } else {
    fitAll();
  }
})();
</script>
