<script>
// awe-web: website template helpers (styling in awe-web.scss)
//  - author bar: Author: … · Created: … · Updated: …, categories below
//  - action row: Slides, Print slides (if the page has slides, announced by
//    lib/filter/slides-link.lua as <meta name="awe-slides">), Copy link,
//    plus every extra margin-header link as a button
//  - "Start" in the top bar becomes "Home" with an icon; light/dark toggle
//  - sidebar title at the top of the navigation
(function () {
  var header = document.getElementById('title-block-header');
  var main = document.getElementById('quarto-document-content');

  // header height for the fixed navigation
  var top = document.getElementById('quarto-header');
  if (top) {
    document.documentElement.style.setProperty('--awe-header-height', top.offsetHeight + 'px');
  }

  // --- author bar ---------------------------------------------------------
  var text = function (sel) {
    var e = header && header.querySelector(sel);
    return e ? e.textContent.trim() : '';
  };
  // one labelled item of the author bar: "Author: Andy Weeger"
  var item = function (label, value) {
    var s = document.createElement('span');
    s.className = 'awe-meta-item';
    var l = document.createElement('span');
    l.className = 'awe-meta-label';
    l.textContent = label + ':';
    s.appendChild(l);
    s.appendChild(document.createTextNode(value));
    return s;
  };

  // page-meta: false (front matter) -> no author bar, no action buttons
  var noMeta = !!document.querySelector('meta[name="awe-page-meta"][content="false"]');

  var actionsAnchor = null;
  if (header && !noMeta) {
    var bar = document.createElement('div');
    bar.className = 'awe-meta';
    var authors = Array.prototype.map.call(
      header.querySelectorAll('.quarto-title-meta-contents p:not(.date):not(.date-modified), .quarto-title-author-name'),
      function (e) { return e.textContent.trim(); }).filter(Boolean);
    if (authors.length) bar.appendChild(item(authors.length > 1 ? 'Authors' : 'Author', authors.join(', ')));
    var published = text('.date');
    var modified = text('.date-modified');
    if (published) bar.appendChild(item('Created', published));
    if (modified) bar.appendChild(item('Updated', modified));
    // categories: second row of the author bar, as pills
    var cats = Array.prototype.map.call(header.querySelectorAll('.quarto-category'),
      function (e) { return e.textContent.trim(); }).filter(Boolean);
    if (cats.length) {
      var catRow = document.createElement('div');
      catRow.className = 'awe-meta-categories';
      cats.forEach(function (c) {
        var pill = document.createElement('span');
        pill.className = 'awe-category';
        pill.textContent = c;
        catRow.appendChild(pill);
      });
      bar.appendChild(catRow);
    }
    // no author, dates or categories: no (empty) bar; buttons follow the title
    if (bar.childNodes.length) {
      header.appendChild(bar);
      actionsAnchor = bar;
    } else {
      actionsAnchor = header.lastElementChild || null;
    }
  }

  // --- action row ---------------------------------------------------------
  var row = document.createElement('div');
  row.className = 'awe-actions';
  var button = function (label, cls) {
    var b = document.createElement('a');
    b.className = 'awe-action ' + (cls || '');
    b.textContent = label;
    return b;
  };
  var slidesMeta = document.querySelector('meta[name="awe-slides"]');
  var slidesUrl = slidesMeta ? new URL(slidesMeta.content, window.location.href).href : null;

  var addSlides = function () {
    var s = button('Slides', 'awe-action-primary');
    s.href = slidesUrl;
    s.target = '_blank';
    var p = button('Print slides');
    p.href = slidesUrl + '?print-pdf';
    p.target = '_blank';
    row.insertBefore(p, row.firstChild);
    row.insertBefore(s, row.firstChild);
  };

  // extra margin-header links become buttons; slide links are added
  // automatically, so they are skipped here
  document.querySelectorAll('.quarto-margin-header a').forEach(function (a) {
    var href = a.getAttribute('href') || '';
    if (/(^|\/)slides\.html(\?|#|$)/.test(href)) return;
    var b = button(a.textContent.trim());
    b.href = a.href;
    if (a.target) b.target = a.target;
    row.appendChild(b);
  });

  var copy = button('Copy link');
  copy.href = '#';
  copy.addEventListener('click', function (e) {
    e.preventDefault();
    var done = function () {
      copy.textContent = 'Link copied';
      copy.classList.add('awe-action-done');
      setTimeout(function () {
        copy.textContent = 'Copy link';
        copy.classList.remove('awe-action-done');
      }, 1800);
    };
    var url = window.location.href.split('#')[0];
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, done);
    } else {
      done();
    }
  });
  row.appendChild(copy);

  if (actionsAnchor) {
    actionsAnchor.insertAdjacentElement('afterend', row);
    // slides: announced at render time by lib/filter/slides-link.lua
    if (slidesUrl) addSlides();
  }

  // --- top bar: site title; the part after the first word gets its own
  // span so small screens can show only "awe" (awe-web.scss) -------------
  var siteTitle = document.querySelector('#quarto-header .navbar-title');
  if (siteTitle && siteTitle.children.length === 0) {
    var m = siteTitle.textContent.match(/^(\S+)(\s.*)$/);
    if (m) {
      siteTitle.textContent = m[1];
      var rest = document.createElement('span');
      rest.className = 'awe-title-rest';
      rest.textContent = m[2];
      siteTitle.appendChild(rest);
    }
  }

  // --- top bar: the "Start" button becomes "Home" with an icon -----------
  document.querySelectorAll('#quarto-header .navbar-nav .nav-link').forEach(function (a) {
    var t = a.querySelector('.menu-text') || a;
    if (t.textContent.trim() !== 'Start') return;
    t.textContent = 'Home';
    a.classList.add('awe-nav-home');
    a.insertAdjacentHTML('afterbegin', '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17 21H7C4.79086 21 3 19.2091 3 17V10.7076C3 9.30887 3.73061 8.01175 4.92679 7.28679L9.92679 4.25649C11.2011 3.48421 12.7989 3.48421 14.0732 4.25649L19.0732 7.28679C20.2694 8.01175 21 9.30887 21 10.7076V17C21 19.2091 19.2091 21 17 21Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 17H15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>');
  });

  // --- light/dark toggle in the top bar ----------------------------------
  // the scheme is set before the first paint by awe-web-head.html; the
  // button switches it and stores the choice
  var nav = document.querySelector('#quarto-header .navbar-nav');
  if (nav) {
    var li = document.createElement('li');
    li.className = 'nav-item';
    var tb = document.createElement('button');
    tb.type = 'button';
    tb.className = 'nav-link awe-theme-toggle';
    tb.innerHTML =
      '<svg class="awe-icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 11.5066C3 16.7497 7.25034 21 12.4934 21C16.2209 21 19.4466 18.8518 21 15.7259C12.4934 15.7259 8.27411 11.5066 8.27411 3C5.14821 4.55344 3 7.77915 3 11.5066Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '<svg class="awe-icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 18C15.3137 18 18 15.3137 18 12C18 8.68629 15.3137 6 12 6C8.68629 6 6 8.68629 6 12C6 15.3137 8.68629 18 12 18Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 12L23 12M12 2V1M12 23V22M20 20L19 19M20 4L19 5M4 20L5 19M4 4L5 5M1 12L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var label = function () {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      var t = dark ? 'Switch to light mode' : 'Switch to dark mode';
      tb.setAttribute('aria-label', t);
      tb.title = t;
    };
    label();
    tb.addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('awe-theme', next); } catch (e) {}
      label();
    });
    li.appendChild(tb);
    nav.appendChild(li);
  }

  // --- sidebar title (announced by lib/filter/slides-link.lua) ------------
  var sidebar = document.querySelector('#quarto-sidebar .sidebar-menu-container, #quarto-sidebar');
  var sidebarTitle = document.querySelector('meta[name="awe-sidebar-title"]');
  if (sidebar && sidebarTitle && sidebarTitle.content) {
    var sec = document.createElement('div');
    sec.className = 'awe-sidebar-title';
    sec.innerHTML = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 2L16.5 2L21 6.5V19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 20.5V6.5C3 5.67157 3.67157 5 4.5 5H14.2515C14.4106 5 14.5632 5.06321 14.6757 5.17574L17.8243 8.32426C17.9368 8.43679 18 8.5894 18 8.74853V20.5C18 21.3284 17.3284 22 16.5 22H4.5C3.67157 22 3 21.3284 3 20.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 5V8.4C14 8.73137 14.2686 9 14.6 9H18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var label = document.createElement('span');
    label.textContent = sidebarTitle.content;
    sec.appendChild(label);
    sidebar.insertBefore(sec, sidebar.firstChild);
  }
  // --- tables: fit columns to their content (same logic as the slides) ----
  // measure each column's one-line width and longest word; if everything
  // fits, nothing wraps; otherwise the narrowest columns stay on one line
  // and only the widest ones wrap
  var ctx = document.createElement('canvas').getContext('2d');
  var textWidth = function (cell, txt) {
    var cs = getComputedStyle(cell);
    ctx.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    return ctx.measureText(txt).width * 1.02;
  };
  var sum = function (a) { return a.reduce(function (x, y) { return x + y; }, 0); };
  var fitTable = function (t) {
    var rows = Array.prototype.slice.call(t.rows);
    var n = rows.reduce(function (m, r) { return Math.max(m, r.cells.length); }, 0);
    var cols = [];
    for (var c = 0; c < n; c++) {
      cols.push(rows.map(function (r) { return r.cells[c]; }).filter(Boolean));
    }
    if (!cols.length) return;
    var maxW = cols.map(function (cells) {
      return Math.max.apply(null, cells.map(function (x) { return textWidth(x, x.textContent.trim()); }));
    });
    var minW = cols.map(function (cells) {
      return Math.max.apply(null, cells.map(function (x) {
        return Math.max.apply(null, x.textContent.trim().split(/\s+/).map(function (w) { return textWidth(x, w); }));
      }));
    });
    var pad = cols.map(function (cells) {
      var cs = getComputedStyle(cells[0]);
      return (parseFloat(cs.paddingRight) || 0) + (parseFloat(cs.paddingLeft) || 0);
    });
    var container = t.parentElement;
    var avail = (container ? container.getBoundingClientRect().width : 0) - sum(pad);
    if (!(avail > 0)) return;
    var fixed = {};
    var keys = cols.map(function (_, i) { return i; });
    if (sum(maxW) <= avail) {
      keys.forEach(function (k) { fixed[k] = true; });
    } else {
      keys.slice().sort(function (a, b) { return maxW[a] - maxW[b]; }).forEach(function (c) {
        var fixedW = sum(keys.filter(function (k) { return fixed[k]; }).map(function (k) { return maxW[k]; }));
        var restMin = sum(keys.filter(function (k) { return k !== c && !fixed[k]; }).map(function (k) { return minW[k]; }));
        if (maxW[c] + fixedW + restMin <= avail) fixed[c] = true;
      });
    }
    cols.forEach(function (cells, c) {
      cells.forEach(function (x) { x.classList.toggle('awe-nowrap', !!fixed[c]); });
    });
  };
  var fitTables = function () {
    document.querySelectorAll('#quarto-document-content table').forEach(fitTable);
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTables); else fitTables();
  window.addEventListener('resize', fitTables);

  // --- scroll-to-top button -----------------------------------------------
  var topBtn = document.createElement('button');
  topBtn.type = 'button';
  topBtn.className = 'awe-to-top';
  topBtn.setAttribute('aria-label', 'Back to top');
  topBtn.title = 'Back to top';
  topBtn.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>';
  topBtn.addEventListener('click', function () {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  });
  document.body.appendChild(topBtn);
  var toggleTop = function () {
    topBtn.classList.toggle('awe-to-top-visible', window.scrollY > window.innerHeight * 0.8);
  };
  window.addEventListener('scroll', toggleTop, { passive: true });
  toggleTop();

  // --- alignment ----------------------------------------------------------
  // site title in line with the sidebar content; footer from the
  // site title to the rightmost top-bar button (both move with the page grid)
  var align = function () {
    var root = document.documentElement;
    // first thing in the sidebar: the title's icon, else the first link
    var homeIcon = document.querySelector('.awe-sidebar-title svg, #quarto-sidebar .sidebar-item-text');
    var article = document.getElementById('quarto-document-content');
    if (homeIcon && homeIcon.getBoundingClientRect().width > 0) {
      root.style.setProperty('--awe-brand-left', Math.round(homeIcon.getBoundingClientRect().left) + 'px');
    } else {
      root.style.removeProperty('--awe-brand-left');
    }
    if (article) {
      var r = article.getBoundingClientRect();
      root.style.setProperty('--awe-article-left', Math.round(r.left) + 'px');
      root.style.setProperty('--awe-article-width', Math.round(r.width) + 'px');
    }
    // footer edges: left edge of the site title, right edge of the rightmost
    // visible top-bar button (Start; the burger button on small screens)
    var brandEl = document.querySelector('#quarto-header .navbar-brand');
    var buttons = Array.prototype.slice.call(document.querySelectorAll(
      '#quarto-header .navbar-nav .nav-link, #quarto-header .quarto-btn-toggle'))
      .filter(function (b) { return b.getBoundingClientRect().width > 0; });
    if (brandEl && buttons.length) {
      var left = brandEl.getBoundingClientRect().left;
      var right = Math.max.apply(null, buttons.map(function (b) { return b.getBoundingClientRect().right; }));
      root.style.setProperty('--awe-footer-left', Math.round(left) + 'px');
      root.style.setProperty('--awe-footer-width', Math.round(right - left) + 'px');
    }
  };
  align();
  window.addEventListener('resize', align);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(align);
})();
</script>
