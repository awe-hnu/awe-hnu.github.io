<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">

  <!-- title -->
  <text x="450" y="50" text-anchor="middle" font-size="26" fill="#0333ff" font-weight="bold">Jagged Frontier of AI Capabilities</text>

  <!-- Equal Difficulty Tasks: smooth reference curve -->
  <path d="M 100,120 C 320,85 480,190 560,270 C 660,370 760,410 830,470"
        fill="none" stroke="#888" stroke-width="3" stroke-dasharray="10,8"/>

  <!-- AI Abilities: jagged capability curve -->
  <path d="M 100,160
           C 160,120 220,55 320,65
           C 380,72 400,150 440,230
           C 480,310 500,400 560,430
           C 610,455 650,440 690,405
           C 740,365 780,415 830,470"
        fill="none" stroke="#0333ff" stroke-width="5" stroke-linecap="round"/>

  <!-- Task inside the frontier: AI curve above the reference line -->
  <circle cx="330" cy="68" r="7" fill="#e8a33d"/>
  <line x1="330" y1="68" x2="330" y2="100" stroke="#e8a33d" stroke-width="1.5"/>
  <text x="330" y="118" text-anchor="middle" font-size="17" fill="#333">Task inside the frontier</text>

  <!-- Task outside the frontier: AI curve well below the reference line -->
  <circle cx="560" cy="430" r="7" fill="#c0392b"/>
  <line x1="560" y1="430" x2="560" y2="295" stroke="#c0392b" stroke-width="1.5"/>
  <text x="560" y="278" text-anchor="middle" font-size="17" fill="#333">Task outside the frontier</text>

  <!-- Task on the frontier: the two curves meet -->
  <circle cx="830" cy="470" r="7" fill="#2f9e5b"/>
  <text x="740" y="500" text-anchor="middle" font-size="17" fill="#333">Task on the frontier</text>

  <!-- legend -->
  <g transform="translate(90,500)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#0333ff" stroke-width="5"/>
    <text x="50" y="6" font-size="17" fill="#333">AI Abilities</text>
    <line x1="0" y1="28" x2="40" y2="28" stroke="#888" stroke-width="3" stroke-dasharray="10,8"/>
    <text x="50" y="34" font-size="17" fill="#333">Equal Difficulty Tasks</text>
  </g>
</svg>
